<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Number Line Games</title>
<style>
:root{color-scheme:light dark;--navy:#0e2a47;--navy2:#163f66;--cream:#fff8e7;--paper:#fffdf7;--gold:#d9a441;--gold2:#f2c761;--wave:#2d91c7;--wave2:#bde7f4;--red:#cc3b37;--green:#287a59;--ink:#10243a;--muted:#536579;--card:#fff;--line:#d6ccb6;--shadow:0 12px 34px rgba(14,42,71,.14)}
@media(prefers-color-scheme:dark){:root{--cream:#0a1d30;--paper:#102a43;--card:#15344f;--ink:#f8f2df;--muted:#c4d3de;--line:#3d5870;--wave2:#143b55;--gold2:#e1b855;--shadow:0 12px 34px rgba(0,0,0,.3)}}
*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"Avenir Next",Avenir,"Trebuchet MS",system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;line-height:1.45}button{font:inherit}.wrap{width:min(1100px,100%);margin:auto;padding:clamp(18px,4vw,42px)}.map-hero{display:grid;grid-template-columns:1.5fr .8fr;gap:20px;align-items:end;margin:8px 0 28px}.map-hero h1{font-size:clamp(2rem,6vw,4.6rem);line-height:.98;margin:0;color:var(--navy);letter-spacing:-.045em}.map-hero h1 span{display:block;color:var(--wave);font-size:.46em;letter-spacing:.01em;margin-bottom:10px}.lead{font-size:clamp(1rem,2vw,1.2rem);max-width:42rem;margin:16px 0 0;color:var(--muted)}.log{background:var(--navy);color:#fff;padding:18px 20px;border-radius:12px 12px 3px 12px;box-shadow:var(--shadow)}.log small{display:block;color:#bed4e5;font-weight:700}.log strong{font-size:2rem;color:var(--gold2)}.islands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.island{position:relative;min-height:190px;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-top:7px solid var(--accent,var(--wave));border-radius:14px 14px 5px 14px;padding:20px;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}.island:hover,.island:focus-visible{transform:translateY(-4px);box-shadow:0 18px 34px rgba(14,42,71,.2)}.island:focus-visible,.answer:focus-visible,.primary:focus-visible,.secondary:focus-visible{outline:4px solid var(--gold2);outline-offset:3px}.island .num{font-weight:900;color:var(--accent);font-size:.86rem}.island .ico{font-size:2.2rem;display:block;margin:8px 0}.island h2{font-size:1.22rem;line-height:1.15;margin:0 0 8px}.island p{font-size:.9rem;color:var(--muted);margin:0 0 16px}.stars{letter-spacing:2px;font-size:.92rem;color:var(--gold)}.stars .off{color:var(--line)}
.hidden{display:none!important}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.back{border:0;background:transparent;color:var(--navy);font-weight:850;cursor:pointer;padding:9px 0}.progress{font-weight:800;color:var(--muted)}.progressbar{height:8px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:24px}.progressbar i{display:block;height:100%;background:var(--wave);width:0;transition:width .3s}.island-head{display:flex;align-items:center;gap:16px;margin-bottom:20px}.island-head .ico{font-size:3rem}.island-head h1{margin:0;font-size:clamp(1.8rem,5vw,3.3rem);line-height:1}.island-head p{margin:8px 0 0;color:var(--muted);font-weight:700}.strategy{background:var(--card);border:1px solid var(--line);border-radius:18px 5px 18px 5px;padding:clamp(18px,4vw,30px);box-shadow:var(--shadow);margin-bottom:22px}.strategy h2{margin:0 0 14px;font-size:1.4rem}.steps{display:grid;gap:10px;counter-reset:steps;margin:0;padding:0;list-style:none}.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}.steps li:before{counter-increment:steps;content:counter(steps);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-weight:900}.remember{margin:16px 0 0;padding:12px 14px;background:var(--wave2);border-radius:7px;font-weight:800}.demo-wrap{margin:18px 0 8px;min-height:160px;display:grid;place-items:center;overflow:hidden}.numberline{width:100%;height:auto;min-height:145px}.primary,.secondary{border:0;border-radius:9px;padding:12px 18px;font-weight:900;cursor:pointer}.primary{background:var(--navy);color:#fff;box-shadow:0 5px 0 #07192b}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #07192b}.secondary{background:var(--wave2);color:var(--navy)}.question-card{background:var(--card);border:1px solid var(--line);border-radius:6px 22px 6px 22px;padding:clamp(20px,5vw,38px);box-shadow:var(--shadow)}.q-kicker{color:var(--wave);font-weight:900;margin:0 0 6px}.question-card h2{font-size:clamp(1.45rem,4vw,2.2rem);margin:0;text-align:center;line-height:1.2}.visual{margin:16px auto;max-width:820px;min-height:110px;display:grid;place-items:center}.equation{font-size:clamp(2rem,8vw,4rem);font-weight:950;letter-spacing:.02em;text-align:center}.pattern{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:clamp(1.5rem,5vw,2.7rem);font-weight:900}.pattern span{padding:8px 12px;background:var(--wave2);border-radius:8px}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.answer{border:2px solid var(--navy);background:var(--paper);color:var(--ink);border-radius:11px;padding:15px 10px;font-weight:950;font-size:clamp(1rem,3vw,1.25rem);cursor:pointer;min-height:58px}.answer:hover{background:var(--wave2)}.answer.correct{background:#d6f3e4;border-color:var(--green);color:#15553c}.answer.wrong{background:#f8dcda;border-color:var(--red);color:#8f2422}.feedback{min-height:36px;text-align:center;font-weight:900;margin:14px 0 0}.feedback.good{color:var(--green)}.feedback.hint{color:var(--red)}.continue{display:block;margin:14px auto 0}.complete{text-align:center;background:var(--card);border:1px solid var(--line);padding:clamp(28px,7vw,64px);border-radius:20px 5px;box-shadow:var(--shadow);position:relative;overflow:hidden}.complete .big{font-size:4rem}.complete h1{font-size:clamp(2rem,7vw,4rem);margin:4px 0}.complete .score{font-size:1.4rem;font-weight:900}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}.confetti{position:absolute;inset:0;pointer-events:none}.confetti i{position:absolute;width:10px;height:18px;background:var(--gold);animation:fall 1.8s ease-in infinite}.confetti i:nth-child(2n){background:var(--wave);animation-delay:.3s}.confetti i:nth-child(3n){background:var(--red);animation-delay:.7s}@keyframes fall{from{transform:translateY(-40px) rotate(0)}to{transform:translateY(420px) rotate(540deg)}}.property-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.property-grid div{background:var(--wave2);padding:12px;border-radius:7px}.property-grid strong{display:block;color:var(--navy)}.rhyme{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:1.05rem}.rhyme b:first-child{color:var(--red)}.rhyme b:last-child{color:var(--green)}
@media(max-width:820px){.map-hero{grid-template-columns:1fr}.islands{grid-template-columns:repeat(2,minmax(0,1fr))}.island{min-height:170px}.property-grid{grid-template-columns:1fr}}
@media(max-width:520px){.wrap{padding:16px}.islands{grid-template-columns:1fr 1fr;gap:10px}.island{min-height:158px;padding:14px}.island .ico{font-size:1.8rem;margin:4px 0}.island h2{font-size:1rem}.island p{font-size:.78rem;margin-bottom:10px}.answers{grid-template-columns:1fr}.answer{min-height:52px}.island-head .ico{font-size:2.2rem}.strategy{padding:16px}.demo-wrap{min-height:130px}.numberline{min-height:120px}}
@media(prefers-color-scheme:dark){.map-hero h1,.back,.property-grid strong{color:#f8f2df}.answer.correct{background:#173e31;color:#b9f0d6}.answer.wrong{background:#4b2628;color:#ffd3d0}}
@keyframes starLand{0%{opacity:0;transform:translateY(-60px) scale(1.7) rotate(-20deg)}70%{opacity:1;transform:translateY(5px) scale(.92) rotate(6deg)}100%{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
<section id="mapView">
  <div class="map-hero">
    <div><h1><span>Shivani’s math adventure</span>Choose your next island</h1><p class="lead">Learn one smart number-line strategy, watch it work, then earn five stars. Your voyage has eight stops.</p></div>
    <div class="log"><small>CAPTAIN’S LOG</small><strong id="totalStars">0 / 40 stars</strong><div>Every try makes your math brain stronger.</div></div>
  </div>
  <div class="islands" id="islandGrid"></div>
</section>
<section id="gameView" class="hidden">
  <div class="topbar"><button class="back" id="backBtn">← Back to map</button><div class="progress" id="progressText"></div></div><div class="progressbar"><i id="progressFill"></i></div>
  <div id="gameBody"></div>
</section>
</main>
<script>
const NS='http://www.w3.org/2000/svg';
const praise=['Smooth sailing!','Star navigator!','You cracked it!','Brilliant!'];
const state={stars:Array(8).fill(0),island:0,index:0,roundStars:0,tries:0,questions:[]};
const islands=[
 {name:'Rounding Reef',icon:'⚓',tag:'Round to the nearest ten or hundred',accent:'#cc6b42',hint:'Check the rhyme: five or more, raise the score!',steps:['Find which two tens (or hundreds) the number is between.','Mark it on the number line — which ten is it closer to?','Four or less? Let it rest. Five or more? Raise the score!'],remember:'Four or less? Let it rest. Five or more? Raise the score!',demo:()=>demoLine(30,60,10,46,[46],[],50),make:roundQs},
 {name:'Jumping Jetty',icon:'➕',tag:'Addition with jumps',accent:'#1687a7',hint:'Jump to the nearest ten first!',steps:['Start at the first number.','Jump to the nearest ten.','Jump by tens.','Jump by ones.','Add the jumps!'],demo:()=>demoLine(55,75,5,57,[57,60,70,72],[[57,60,'+3'],[60,70,'+10'],[70,72,'+2']]),make:addQs},
 {name:'Hop-Back Harbor',icon:'➖',tag:'Subtraction with jumps',accent:'#5e7d4f',hint:'Start at the smaller number and count up!',steps:['Start at the SMALLER number.','Jump up by tens, then ones, to the bigger number.','Add the jumps — that’s the difference!'],remember:'Another way: start at 62, take away 30, then 9: 62 → 32 → 23.',demo:()=>demoLine(35,65,5,39,[39,49,59,62],[[39,49,'+10'],[49,59,'+10'],[59,62,'+3']]),make:subQs},
 {name:'Estimate Cove',icon:'🔍',tag:'Estimate sums and differences',accent:'#bd7c19',hint:'Round to friendly numbers first!',steps:['You don’t need the exact answer — just “about how much.”','Round each number, or pick friendly compatible numbers.','Add or subtract the friendly numbers.'],demo:()=>demoLine(300,600,50,432,[432,400,500],[[432,400,'≈400'],[400,500,'+500']]),make:estimateQs},
 {name:'Pattern Port',icon:'🌀',tag:'Find and continue number patterns',accent:'#8d5b9d',hint:'What changes from one number to the next?',steps:['Look at how each number changes to the next.','Say the rule, like “add 4.”','Use the rule to find the missing number.'],demo:()=>'<div class="pattern"><span>1</span><span>4</span><span>7</span><span>10</span><span>13</span><span>16</span></div><p><b>Rule: add 3 each time</b></p>',make:patternQs},
 {name:'Property Pier',icon:'⚖️',tag:'Addition properties',accent:'#4471b6',hint:'Read the property cards again: order, grouping, or adding zero?',steps:['Commutative: order doesn’t matter. 16 + 9 = 9 + 16.','Associative: grouping doesn’t matter. (16 + 7) + 23 = 16 + (7 + 23).','Identity: adding 0 changes nothing. 7 + 0 = 7.'],demo:()=>'<div class="property-grid"><div><strong>Order</strong>8 + 3 = 3 + 8</div><div><strong>Grouping</strong>(2 + 5) + 4 = 2 + (5 + 4)</div><div><strong>Zero</strong>9 + 0 = 9</div></div>',make:propertyQs},
 {name:'Treasure Plot Point',icon:'⭐',tag:'Plot a 3-digit number',accent:'#c58a17',hint:'Find the hundreds, then use the 50s to help you!',steps:['Look! — Look at the number you want to plot. Example: 375.','Find the hundreds! — Find the two hundreds the number is between.','Think! — See how far the number is past the first hundred.','Plot! — Put a point where the number belongs. Label it with the number!'],remember:'Remember: Find the hundreds. Use the 50s to help you. See how far past the first hundred. Plot it. Label it!',demo:()=>plotDemo(375),make:plotQs},
 {name:'Pirate Compare Cove',icon:'🏴‍☠️',tag:'Compare and order numbers',accent:'#b7473e',hint:'Start with the hundreds! Same hundreds? Check the tens. Left on the line means less!',steps:['Look at the hundreds — the number with more hundreds is greater.','Look at the tens — if hundreds are the same.','Look at the ones — if hundreds and tens are the same.','Use the symbols — > is GREATER THAN, < is LESS THAN, = is EQUAL TO.'],remember:'Pirate tip: 350 is left of 575 on the number line, so 350 < 575.',demo:()=>compareDemo(472,458),make:compareQs}
];
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function starText(n){return '<span aria-label="'+n+' of 5 stars">'+Array.from({length:5},(_,i)=>i<n?'★':'<span class="off">★</span>').join('')+'</span>'}
function renderMap(){mapView.classList.remove('hidden');gameView.classList.add('hidden');islandGrid.innerHTML=islands.map((x,i)=>`<button class="island" style="--accent:${x.accent}" data-i="${i}"><span class="num">ISLAND ${i+1}</span><span class="ico" aria-hidden="true">${x.icon}</span><h2>${x.name}</h2><p>${x.tag}</p><span class="stars">${starText(state.stars[i])}</span></button>`).join('');totalStars.textContent=`${state.stars.reduce((a,b)=>a+b,0)} / 40 stars`;document.querySelectorAll('.island').forEach(b=>b.onclick=()=>openIsland(+b.dataset.i));}
function openIsland(i){state.island=i;state.index=0;state.roundStars=0;state.tries=0;state.questions=islands[i].make();mapView.classList.add('hidden');gameView.classList.remove('hidden');showStrategy();window.scrollTo(0,0)}
function showStrategy(){const x=islands[state.island];progressText.textContent='Strategy first · 5 questions next';progressFill.style.width='0%';gameBody.innerHTML=`<div class="island-head"><span class="ico" aria-hidden="true">${x.icon}</span><div><h1>${x.name}</h1><p>${x.tag}</p></div></div><article class="strategy"><h2>Teacher’s Strategy</h2><ol class="steps">${x.steps.map(s=>`<li>${s}</li>`).join('')}</ol>${x.remember?`<div class="remember">${x.remember}</div>`:''}<div class="demo-wrap" id="demo">${x.demo()}</div><button class="primary" id="watch">Watch it work</button></article><button class="primary" id="start" style="display:block;margin:0 auto">I’m ready — start questions</button>`;watch.onclick=()=>{demo.innerHTML=x.demo(true)};start.onclick=()=>showQuestion()}
function showQuestion(){const q=state.questions[state.index];state.tries=0;progressText.textContent=`Question ${state.index+1} of 5 · ${state.roundStars} stars`;progressFill.style.width=(state.index/5*100)+'%';gameBody.innerHTML=`<article class="question-card"><p class="q-kicker">${islands[state.island].name}</p><h2>${q.prompt}</h2><div class="visual">${q.visual||''}</div><div class="answers">${q.choices.map((c,i)=>`<button class="answer" data-v="${esc(String(c.value??c))}">${c.label??c}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><button class="primary continue hidden" id="continueBtn">${state.index===4?'See my stars':'Next question →'}</button></article>`;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(b,q));}
function esc(s){return s.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}
function answer(btn,q){if(btn.classList.contains('correct')||document.querySelector('.continue:not(.hidden)'))return;state.tries++;const ok=btn.dataset.v===String(q.answer);if(ok){btn.classList.add('correct');document.querySelectorAll('.answer').forEach(b=>b.disabled=true);if(state.tries===1)state.roundStars++;feedback.className='feedback good';feedback.textContent=(state.island===7?'You’ve got it, Matie! ':praise[Math.floor(Math.random()*praise.length)]+' ')+(state.tries===1?'You earned a star.':'That’s the answer!');continueBtn.classList.remove('hidden')}else{btn.classList.add('wrong');if(state.tries===1){feedback.className='feedback hint';feedback.textContent='Try once more. '+(q.hint||islands[state.island].hint)}else{document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.dataset.v===String(q.answer))b.classList.add('correct')});feedback.className='feedback hint';feedback.textContent=`Good learning! The answer is ${q.answer}.`;continueBtn.classList.remove('hidden')}}}
function next(){state.index++;if(state.index>=5)complete();else showQuestion()}
function complete(){state.stars[state.island]=Math.max(state.stars[state.island],state.roundStars);progressText.textContent='Island complete';progressFill.style.width='100%';gameBody.innerHTML=`<div class="complete"><div class="confetti">${Array.from({length:16},(_,i)=>`<i style="left:${(i*37)%100}%;top:${-(i%4)*30}px"></i>`).join('')}</div><div class="big">${islands[state.island].icon}</div><h1>Island complete!</h1><p class="score">${starText(state.roundStars)}<br>${state.roundStars} of 5 stars</p><p>${state.roundStars===5?'Perfect voyage, Captain Shivani!':state.roundStars>=3?'Strong sailing — your strategy is working!':'Every try trained your math brain. Sail again when you’re ready!'}</p><div class="actions"><button class="primary" id="again">Sail again</button><button class="secondary" id="map">Back to map</button></div></div>`;again.onclick=()=>openIsland(state.island);map.onclick=renderMap}
document.addEventListener('click',e=>{if(e.target.id==='continueBtn')next()});backBtn.onclick=renderMap;
function svgLine(min,max,step,opts={}){const W=760,H=170,L=45,R=715,Y=105;const x=v=>L+(v-min)/(max-min)*(R-L);let ticks='';for(let v=min;v<=max+.001;v+=step){const major=opts.majorEvery&&v%opts.majorEvery===0;ticks+=`<line x1="${x(v)}" y1="${Y-(major?15:10)}" x2="${x(v)}" y2="${Y+(major?15:10)}" stroke="${major?'#d9a441':'currentColor'}" stroke-width="${major?4:2}"/><text x="${x(v)}" y="${Y+38}" text-anchor="middle" class="tick ${v===opts.mid?'mid':''}">${v}</text>`}let marks=(opts.marks||[]).map((m,i)=>`<circle cx="${x(m.value??m)}" cy="${Y}" r="8" fill="${m.color||'#cc3b37'}"/><text x="${x(m.value??m)}" y="${Y-18}" text-anchor="middle" class="mark">${m.label??m}</text>`).join('');let candidates=(opts.candidates||[]).map(c=>`<text x="${x(c.value)}" y="${Y-22}" text-anchor="middle" class="star">★</text><text x="${x(c.value)}" y="${Y-48}" text-anchor="middle" class="cand">${c.label}</text>`).join('');return `<svg class="numberline" viewBox="0 0 ${W} ${H}" role="img" aria-label="Number line from ${min} to ${max}"><style>.tick{font:700 15px system-ui;fill:currentColor}.mid{fill:#cc3b37;font-weight:900}.mark{font:900 16px system-ui;fill:#cc3b37}.star{font-size:27px;fill:#d9a441;transform-box:fill-box;transform-origin:center;animation:starLand .8s cubic-bezier(.2,.8,.3,1) both}.cand{font:900 16px system-ui;fill:#0e2a47}@media(prefers-color-scheme:dark){.cand{fill:#fff8e7}}</style><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="currentColor"/></marker></defs><line x1="${L}" y1="${Y}" x2="${R}" y2="${Y}" stroke="currentColor" stroke-width="4" marker-start="url(#arr)" marker-end="url(#arr)"/>${ticks}${candidates}${marks}</svg>`}
function demoLine(min,max,step,start,points,jumps=[],mid){const W=760,H=190,L=45,R=715,Y=120,x=v=>L+(v-min)/(max-min)*(R-L);let base=svgLine(min,max,step,{mid}).replace('</svg>','');let paths='';jumps.forEach((j,i)=>{const [a,b,l]=j, xa=x(a),xb=x(b),peak=Math.min(60,Math.abs(xb-xa)*.35+20);paths+=`<path id="p${i}" d="M${xa},${Y-7} Q${(xa+xb)/2},${Y-peak} ${xb},${Y-7}" fill="none" stroke="#2d91c7" stroke-width="4" stroke-dasharray="5 5"/><text x="${(xa+xb)/2}" y="${Y-peak/2-16}" text-anchor="middle" font-weight="900" fill="#1687a7">${l}</text>`});let reduced=matchMedia('(prefers-reduced-motion:reduce)').matches,dur=reduced?'0.01s':Math.max(.6,jumps.length*.6)+'s';let motionPath=`M${x(points[0])},${Y}`;for(let i=1;i<points.length;i++){const xa=x(points[i-1]),xb=x(points[i]),peak=Math.min(60,Math.abs(xb-xa)*.35+20);motionPath+=` Q${(xa+xb)/2},${Y-peak} ${xb},${Y}`};let dots=points.length?`<circle r="9" fill="#cc3b37"><animateMotion dur="${dur}" fill="freeze" calcMode="paced" path="${motionPath}"/></circle>`:'';return base+paths+dots+'</svg>'}
function plotDemo(n){return svgLine(0,1000,50,{majorEvery:100,marks:[{value:n,label:'⭐ '+n,color:'#d9a441'}]})}
function compareDemo(a,b){return `<div class="equation">${a} &gt; ${b}</div>${svgLine(400,500,10,{marks:[{value:b,label:b,color:'#2d91c7'},{value:a,label:a,color:'#cc3b37'}]})}<p><b>Hundreds tie. Tens decide: 7 &gt; 5.</b></p>`}
function q(prompt,answer,choices,visual='',hint=''){return{prompt,answer,choices:shuffle(choices).map(x=>typeof x==='object'?x:{label:x,value:x}),visual,hint}}
function roundQs(){const data=[[46,50,40,60,30,60,10],[63,60,70,50,50,80,10],[174,200,100,300,0,300,100],[548,500,600,400,400,700,100],[718,700,800,600,600,900,100]];return shuffle(data).map(([n,a,b,c,min,max,step])=>q(`Round ${n} to the nearest ${step===100?'hundred':'ten'}.`,a,[a,b,c],svgLine(min,max,step,{mid:min+(max-min)/2,marks:[{value:n,label:n}]})))}
function addQs(){const d=[[43,28],[63,27],[57,15],[34,29],[48,36]];return shuffle(d).map(([a,b],i)=>{const s=a+b;return q(i===0?`What does the first jump from ${a} land on?`:`What is ${a} + ${b}?`,i===0?Math.ceil(a/10)*10:s,i===0?[Math.ceil(a/10)*10,a+10,a+b]:[s,s-10,s+10],demoLine(Math.floor(a/10)*10,s+10,5,a,[a,s],[[a,s,'+'+b]]))})}
function subQs(){return shuffle([[74,38],[52,25],[86,49],[63,27],[91,56]]).map(([a,b])=>{const d=a-b;return q(`What is ${a} − ${b}?`,d,[d,d+10,d-10],demoLine(b-5,a+5,5,b,[b,a],[[b,a,'+'+d]]))})}
function estimateQs(){return shuffle([[65,23,90,88,100],[642,-287,300,355,400],[432,489,900,921,800],[376,-148,250,228,100],[304,494,800,798,700]]).map(([a,b,ans,exact,wild])=>q(`About how much is ${a} ${b<0?'−':'+'} ${Math.abs(b)}?`,ans,[ans,exact,wild],`<div class="equation">${Math.round(a/100)*100} ${b<0?'−':'+'} ${Math.round(Math.abs(b)/100)*100} ≈ ?</div>`))}
function patternQs(){let arr=[q('What number is missing?',44,[44,42,46],'<div class="pattern"><span>32</span><span>36</span><span>40</span><span>?</span><span>48</span></div>'),q('What number is missing?',77,[77,78,82],'<div class="pattern"><span>87</span><span>82</span><span>?</span><span>72</span></div>'),q('What comes next?',41,[41,40,42],'<div class="pattern"><span>17</span><span>23</span><span>29</span><span>35</span><span>?</span></div>'),q('Is 5 + 8 even or odd?','Odd',[{label:'Even',value:'Even'},{label:'Odd',value:'Odd'}],'<div class="equation">5 + 8 = 13</div>'),q('What comes next?',34,[34,35,36],'<div class="pattern"><span>58</span><span>52</span><span>46</span><span>40</span><span>?</span></div>')];return shuffle(arr)}
function propertyQs(){return shuffle([['16 + 9 = 9 + 16','Commutative'],['(16 + 7) + 23 = 16 + (7 + 23)','Associative'],['7 + 0 = 7','Identity'],['4 + (6 + 8) = (4 + 6) + 8','Associative'],['32 + 15 = 15 + 32','Commutative']]).map(([eq,a])=>q('Which property is this?',a,['Commutative','Associative','Identity'],`<div class="equation">${eq}</div>`))}
function plotQs(){const nums=[175,325,475,625,875];return shuffle(nums).map((n,i)=>{const low=Math.floor(n/100)*100,high=low+100;if(i===0)return q(`${n} is between which two hundreds?`,`${low} and ${high}`,[`${low} and ${high}`,`${low-100} and ${low}`,`${high} and ${high+100}`],svgLine(0,1000,50,{majorEvery:100}));const vals=shuffle([n,n-100,(n%100<50?low+75:low+25)]);const labels=['A','B','C'];return q(`Where does ${n} belong?`,labels[vals.indexOf(n)],labels.map((l,j)=>({label:`⭐ ${l}`,value:l})),svgLine(0,1000,50,{majorEvery:100,candidates:vals.map((v,j)=>({value:v,label:labels[j]}))}))})}
function compareQs(){const pairs=[[625,389],[472,458],[836,832],[350,575],[444,444]];return shuffle(pairs).map(([a,b],i)=>{const ans=a>b?'>':a<b?'<':'=';const min=Math.max(0,Math.floor((Math.min(a,b)-50)/50)*50),max=Math.min(1000,Math.ceil((Math.max(a,b)+50)/50)*50);return q(i%2?`Which symbol makes this true: ${a} __ ${b}?`:`Compare ${a} and ${b}.`,ans,['>','<','='],i%2?'':svgLine(min,max,Math.max(10,(max-min)/5),{marks:[{value:a,label:a,color:'#cc3b37'},{value:b,label:b,color:'#2d91c7'}]}))})}
renderMap();
